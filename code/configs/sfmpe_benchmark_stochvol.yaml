# Benchmark-scoped SFMPE configuration for StochVolTask.
#
# Referenced from benchmark YAML files via `sfmpe_configs`. Flow and optimizer
# hyperparameters follow the task-specific settings (beta path time
# distribution, slower flow-model learning rate). The runner passes `device`
# explicitly, so `device: auto` only applies when this file is used standalone.
device: auto

flow:
  init_dist:
    type: normal
  velocity_model:
    type: simple
    params:
      # Approximately parameter-matched to sbi 0.21's default 4D/5D MAF
      # density estimator (30,290 parameters; this velocity field has 30,379).
      hidden_dim: 75
      num_layers: 5
  path:
    type: affine
    # params:
    #   time_dist:
    #     type: beta
    #     params:
    #       alpha: 0.8
    #       beta: 0.5

optimizer:
  type: Adam
  params:
    task:
      summary:
        lr: 0.0001
    flow_model:
      lr: 0.00001

loss: MSELoss

proposal:
  method: Truncated
  n_steps: 32
  params:
    # Central marginal mass used for the axis-aligned region around posterior
    # samples; proposals are drawn from the prior conditional on this region.
    quantile: 0.9
    region_samples: 2048
    padding: 0.1
    max_prior_draws: 1000000000

logger:
  name: Benchmark-StochVol
  level: WARNING
  log_to_console: false
  log_to_file: false

run_sequential:
  # Only `clean_sampling` from this section is consumed by the benchmark
  # runner (rounds/budgets come from the benchmark YAML). Truncated sampling
  # always draws from the prior restricted to the posterior-derived region,
  # which also preserves this task's prior support.
  num_rounds: 3
  sims_per_round: 100
  sims_per_sample: 1
  clean_sampling: true
  upd_x: true
  training:
    epochs: 20
    show_every: 1000
    batch_size: 64
    shuffle: true
    num_workers: 0
