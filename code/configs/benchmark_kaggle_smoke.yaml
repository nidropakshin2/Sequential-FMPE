seed: 2026
device: cuda
tasks:
  Gaussian: gaussian.yaml
  SIR: benchmark_sir.yaml
  StochVol: benchmark_stochvol.yaml
methods:
  - SFMPE
  - SNPE_C
  - SMC_ABC
budgets: [40]
replicates: 2
rounds: 2
posterior_samples: 64
output: ./results/kaggle-smoke
sfmpe_proposal_methods:
  StochVol: NPE-A

training:
  epochs: 8
  stop_after_epochs: 3
  batch_size: 32
  learning_rate: 0.0005
  validation_fraction: 0.2

smc_abc:
  particles: 20
  initial_population: 20
  epsilon_decay: 0.5

diagnostics:
  ppc_samples: 16
  sensitivity_enabled: false
  sensitivity_scale: 0.1
  sensitivity_samples: 16
  sbc_c2st: false
