# AUTO-GENERATED by scripts/run_quantile_sweep.py - do not edit.
# sfmpe_benchmark_sir.yaml with proposal.params.quantile patched to 0.75
# (prior-region mass sweep at the canonical seed/protocol).
# Benchmark-scoped SFMPE configuration for SIRTask.
#
# Referenced from benchmark YAML files via `sfmpe_configs`. Proposal values
# follow the smoke-tested benchmark settings; flow and optimizer
# hyperparameters follow the task-specific settings. The runner passes
# `device` explicitly, so `device: auto` only applies when this file is used
# standalone.
device: auto

flow:
  init_dist:
    type: normal
  velocity_model:
    type: simple
    params:
      hidden_dim: 64
      num_layers: 3
  path:
    type: affine

optimizer:
  type: Adam
  params:
    task:
      summary:
        lr: 0.0001
    flow_model:
      lr: 0.0001

loss: MSELoss

proposal:
  method: Truncated
  n_steps: 8
  params:
    # Central marginal mass used for the axis-aligned region around posterior
    # samples; proposals are drawn from the prior conditional on this region.
    quantile: 0.75
    region_samples: 2048
    padding: 0.1
    max_prior_draws: 1000000

logger:
  name: Benchmark-SIR
  level: WARNING
  log_to_console: false
  log_to_file: false

run_sequential:
  # Only `clean_sampling` from this section is consumed by the benchmark
  # runner (rounds/budgets come from the benchmark YAML). Truncated sampling
  # always draws from the prior restricted to the posterior-derived region;
  # `clean_sampling` does not change this behavior.
  num_rounds: 1
  sims_per_round: 100
  sims_per_sample: 1
  clean_sampling: false
  upd_x: false
  training:
    epochs: 20
    show_every: 1000
    batch_size: 64
    shuffle: true
    num_workers: 0
