flow:
  init_dist:
    type: normal
  velocity_model:
    type: simple
    params:
      hidden_dim: 32
      num_layers: 2
  path:
    type: affine

optimizer:
  type: Adam
  params:
    task:
      summary:
        lr: 0.0001
    flow_model:
      lr: 0.0001

loss: MSELoss

proposal:
  method: Truncated
  n_steps: 16
  params:
    quantile: 0.5

logger:
  name: Benchmark
  level: WARNING
  log_to_console: false
  log_to_file: false

run_sequential:
  num_rounds: 1
  sims_per_round: 100
  sims_per_sample: 1
  clean_sampling: false
  upd_x: false
  training:
    epochs: 20
    show_every: 1000
    batch_size: 64
    shuffle: true
    num_workers: 0
