setup:
    device: 'cpu'
    num_rounds: 3
    sims_per_round: 10000
    epochs: 1000
    show_every: 100
    clean_sampling: True
    upd_x: True 

task:
    prior:
        gamma_range: [0.05, 0.5] # tuple, default=(0.05, 0.5)
        beta_range: [0.5, 5.0] # tuple, default=(0.5, 5.0)
    proposal:
        method: "NPE-A"
        params: 
            scale: 0.8
            quantile: 0.5
    simulator:
        S: 1000 #[1500, 2000] # int, tuple, number of Susceptible individuals or bounds for following uniform distribution
        I: 100 #[150, 200] # int, tuple, number of Infectious individuals or bounds for following uniform distribution
        R: 0 #[0, 50] # int, tuple, number of Recovered individuals or bounds for following uniform distribution
        T: 90 #[100, 120]  # int, tuple, simulation duration in days or bounds for following uniform distribution 
    summary: 
        type: "lstm"
        input_dim: 3
        hidden_dim: 32
        num_layers: 3
        output_dim: 5
        dropout: 0.1
    logger:
        name: "SIR" # str, name of the logger
        level: "DEBUG" # str, logging level (e.g., "WARNING", "DEBUG")
        log_file_path: "logs/sir.log" # str, path to log file
